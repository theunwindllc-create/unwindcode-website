<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transmission 26 Instagram Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #030609;
      --panel: rgba(7, 19, 20, 0.84);
      --panel-strong: rgba(14, 27, 28, 0.94);
      --ink: #f4efe4;
      --muted: rgba(244, 239, 228, 0.72);
      --quiet: rgba(244, 239, 228, 0.44);
      --teal: #67d8c5;
      --gold: #dfbb68;
      --coral: #e18765;
      --blue: #8db7ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #010203;
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .slide {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      padding: 64px;
      background:
        linear-gradient(135deg, rgba(103, 216, 197, 0.14), transparent 22%),
        linear-gradient(315deg, rgba(223, 187, 104, 0.12), transparent 26%),
        linear-gradient(145deg, #081315 0%, #071015 48%, #020407 100%);
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 42px;
      border: 1px solid rgba(244, 239, 228, 0.16);
      border-radius: 8px;
      z-index: 1;
    }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(244, 239, 228, 0.055) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(90deg, rgba(103, 216, 197, 0.06) 0 1px, transparent 1px 72px),
        linear-gradient(112deg, transparent 0 36%, rgba(223, 187, 104, 0.1) 36.2%, transparent 36.8% 66%, rgba(103, 216, 197, 0.09) 66.2%, transparent 66.8%);
      opacity: 0.52;
      pointer-events: none;
      z-index: 0;
    }

    .top,
    .content,
    .bottom,
    .property-field,
    .cell-stack,
    .approval-rail,
    .boundary-board {
      position: relative;
      z-index: 2;
    }

    .top,
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 46px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--ink);
      font-size: 24px;
      font-weight: 900;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(103, 216, 197, 0.46);
      border-radius: 50%;
      color: var(--teal);
      font-family: "JetBrains Mono", monospace;
      font-size: 16px;
      box-shadow: 0 0 28px rgba(103, 216, 197, 0.16);
    }

    .brand span span {
      color: var(--teal);
    }

    .kicker,
    .microcopy,
    .bottom {
      font-family: "JetBrains Mono", monospace;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .kicker {
      color: var(--gold);
      font-size: 18px;
    }

    .bottom {
      color: var(--quiet);
      font-size: 17px;
    }

    .url {
      color: var(--gold);
    }

    .content {
      display: grid;
      align-content: center;
      gap: 28px;
      max-width: 790px;
    }

    .content.wide {
      max-width: 890px;
    }

    .content.right {
      justify-self: end;
      max-width: 645px;
    }

    .microcopy {
      color: var(--teal);
      font-size: 18px;
    }

    h1,
    h2 {
      color: var(--ink);
      font-weight: 900;
    }

    h1 {
      max-width: 780px;
      font-size: 84px;
      line-height: 0.98;
    }

    h2 {
      max-width: 900px;
      font-size: 72px;
      line-height: 1.02;
    }

    p {
      max-width: 790px;
      color: var(--muted);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.24;
    }

    .accent {
      color: var(--gold);
    }

    .teal {
      color: var(--teal);
    }

    .coral {
      color: var(--coral);
    }

    .property-field {
      position: absolute;
      right: 76px;
      bottom: 142px;
      display: grid;
      grid-template-columns: repeat(3, 108px);
      grid-template-rows: repeat(3, 108px);
      gap: 14px;
      transform: rotate(-6deg);
    }

    .lot {
      border: 1px solid rgba(103, 216, 197, 0.24);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(244, 239, 228, 0.07), rgba(244, 239, 228, 0.015)),
        rgba(6, 18, 20, 0.7);
      box-shadow: inset 0 0 24px rgba(103, 216, 197, 0.07);
    }

    .lot.active {
      border-color: rgba(223, 187, 104, 0.56);
      background: rgba(223, 187, 104, 0.12);
      box-shadow: 0 0 42px rgba(223, 187, 104, 0.2);
    }

    .cell-stack,
    .approval-rail,
    .boundary-board {
      display: grid;
      gap: 16px;
      margin-top: 8px;
    }

    .cell-row,
    .gate-row,
    .boundary-card {
      display: grid;
      align-items: center;
      border: 1px solid rgba(103, 216, 197, 0.2);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
    }

    .cell-row {
      grid-template-columns: 82px 1fr;
      gap: 20px;
      min-height: 104px;
      padding: 18px 24px;
    }

    .num {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      border: 1px solid rgba(223, 187, 104, 0.42);
      border-radius: 50%;
      background: rgba(223, 187, 104, 0.1);
      color: var(--gold);
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      font-weight: 800;
    }

    .cell-row strong,
    .gate-row strong,
    .boundary-card strong {
      display: block;
      color: var(--ink);
      font-size: 29px;
      font-weight: 900;
      line-height: 1.04;
      margin-bottom: 5px;
    }

    .cell-row span,
    .gate-row span,
    .boundary-card span {
      display: block;
      color: var(--muted);
      font-size: 22px;
      font-weight: 600;
      line-height: 1.24;
    }

    .approval-rail {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: stretch;
      max-width: 900px;
    }

    .gate-row {
      align-content: start;
      min-height: 226px;
      padding: 24px;
      background: var(--panel-strong);
      border-color: rgba(223, 187, 104, 0.24);
    }

    .gate-row .num {
      width: 54px;
      height: 54px;
      margin-bottom: 18px;
      font-size: 18px;
    }

    .gate-row:nth-child(4) {
      border-color: rgba(225, 135, 101, 0.44);
      background: rgba(34, 18, 18, 0.8);
    }

    .boundary-board {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 850px;
    }

    .boundary-card {
      min-height: 148px;
      align-content: start;
      padding: 24px;
    }

    .boundary-card:nth-child(3) {
      grid-column: 1 / -1;
      border-color: rgba(225, 135, 101, 0.36);
      background: rgba(33, 17, 17, 0.74);
    }

    .callout {
      display: inline-grid;
      width: fit-content;
      max-width: 820px;
      gap: 12px;
      padding: 28px 32px;
      border: 1px solid rgba(223, 187, 104, 0.3);
      border-radius: 8px;
      background: rgba(3, 6, 9, 0.58);
    }

    .callout strong {
      color: var(--gold);
      font-size: 30px;
      font-weight: 900;
      line-height: 1.1;
    }

    .callout span {
      color: var(--muted);
      font-size: 23px;
      line-height: 1.24;
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const lots = Array.from({ length: 9 }, (_, index) => `<div class="lot${index === 4 ? ' active' : ''}"></div>`).join("");

    const slides = [
      {
        kicker: "Transmission 026",
        body: `
          <div class="property-field" aria-hidden="true">${lots}</div>
          <div class="content">
            <span class="microcopy">Real estate / governed intelligence</span>
            <h1>The Property Sales Intelligence <span class="accent">Cell.</span></h1>
            <p>Signal can get faster without giving automation the keys.</p>
          </div>
        `
      },
      {
        kicker: "Source before signal",
        body: `
          <div class="content wide">
            <h2>Start with <span class="teal">permission.</span></h2>
            <p>The cell treats every record as evidence first, not outreach fuel.</p>
            <div class="cell-stack">
              <div class="cell-row"><div class="num">01</div><div><strong>Source label</strong><span>Form, referral, owned list, licensed vendor, or manual entry.</span></div></div>
              <div class="cell-row"><div class="num">02</div><div><strong>Evidence trail</strong><span>Preserve consent, ownership context, import review, and suppression posture.</span></div></div>
              <div class="cell-row"><div class="num">03</div><div><strong>Review state</strong><span>Usable signal only after the boundary is visible.</span></div></div>
            </div>
          </div>
        `
      },
      {
        kicker: "Intent without overclaiming",
        body: `
          <div class="content wide">
            <h2>Cleaner judgment beats louder automation.</h2>
            <p>Classify buyer, seller, renter, and investor clues without pretending certainty.</p>
            <div class="boundary-board">
              <div class="boundary-card"><strong>Summarize</strong><span>Turn noisy notes into reviewable context.</span></div>
              <div class="boundary-card"><strong>Qualify</strong><span>Attach confidence, evidence, and missing fields.</span></div>
              <div class="boundary-card"><strong>Escalate</strong><span>Send policy, consent, and sensitive-topic risk to a human.</span></div>
            </div>
          </div>
        `
      },
      {
        kicker: "Approval owns motion",
        body: `
          <div class="content wide">
            <h2>The organism can prepare motion. <span class="coral">It does not own motion.</span></h2>
            <p>Drafts, routes, and recommendations stop at the approval boundary.</p>
            <div class="approval-rail">
              <div class="gate-row"><div class="num">01</div><strong>Source</strong><span>Confirm the record can be used.</span></div>
              <div class="gate-row"><div class="num">02</div><strong>Consent</strong><span>Check evidence and suppression posture.</span></div>
              <div class="gate-row"><div class="num">03</div><strong>Policy</strong><span>Apply provider and brokerage rules.</span></div>
              <div class="gate-row"><div class="num">04</div><strong>Human</strong><span>Approve before outreach or enrollment.</span></div>
            </div>
            <div class="callout">
              <strong>Public-safe intelligence, not unreviewed sales motion.</strong>
              <span>Read Transmission 026 on UnwindCode.ai.</span>
            </div>
          </div>
        `
      }
    ];

    const root = document.getElementById("root");
    const slideNumber = Number((location.hash.match(/slide-(\d+)/) || [])[1] || 1);
    const index = Math.max(0, Math.min(slides.length - 1, slideNumber - 1));
    const slide = slides[index];

    root.innerHTML = `
      <section class="slide">
        <header class="top">
          <div class="brand"><span class="brand-mark">UC</span><span>unwind<span>code</span></span></div>
          <div class="kicker">${slide.kicker}</div>
        </header>
        ${slide.body}
        <footer class="bottom">
          <span>${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</span>
          <span class="url">unwindcode.ai</span>
        </footer>
      </section>
    `;
  </script>
</body>
</html>
