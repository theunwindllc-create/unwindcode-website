<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transmission 24 Instagram Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #05050a;
      --surface: #101018;
      --surface-2: #17151d;
      --ink: #f1eef5;
      --muted: rgba(241, 238, 245, 0.64);
      --dim: rgba(241, 238, 245, 0.34);
      --gold: #d2ac5f;
      --gold-soft: rgba(210, 172, 95, 0.18);
      --gold-line: rgba(210, 172, 95, 0.42);
      --teal: #4f908b;
      --violet: #9b59f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #020204;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(210, 172, 95, 0.08), transparent 28%),
        linear-gradient(22deg, transparent 0 63%, rgba(155, 89, 245, 0.13) 64%, transparent 71%),
        linear-gradient(160deg, #090911 0%, #05050a 62%, #010103 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 72px;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 46px;
      border: 1px solid rgba(210, 172, 95, 0.2);
      border-radius: 42px;
      pointer-events: none;
    }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(118deg, transparent 0 28%, rgba(210, 172, 95, 0.16) 28.2%, transparent 28.7% 62%, rgba(210, 172, 95, 0.1) 62.2%, transparent 62.8%),
        radial-gradient(circle, rgba(210, 172, 95, 0.18) 0 1px, transparent 1.5px);
      background-size: auto, 44px 44px;
      opacity: 0.58;
      pointer-events: none;
    }

    .top,
    .content,
    .bottom {
      position: relative;
      z-index: 2;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 25px;
      color: var(--ink);
    }

    .brand .mark {
      color: var(--violet);
      font-size: 31px;
      line-height: 1;
    }

    .brand .accent {
      color: var(--violet);
    }

    .kicker {
      color: var(--gold);
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .content {
      display: grid;
      align-content: center;
      gap: 34px;
      max-width: 700px;
    }

    .content.wide {
      max-width: 910px;
    }

    h1 {
      font-size: 84px;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--ink);
    }

    h2 {
      font-size: 70px;
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--ink);
    }

    p {
      font-size: 38px;
      line-height: 1.25;
      color: var(--muted);
      font-weight: 500;
      max-width: 830px;
    }

    .gold {
      color: var(--gold);
    }

    .quiet {
      color: var(--dim);
    }

    .mirror-mark {
      width: 280px;
      height: 160px;
      position: relative;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 38px rgba(210, 172, 95, 0.18));
    }

    .loop {
      position: absolute;
      top: 17px;
      width: 142px;
      height: 124px;
      border: 7px solid var(--gold);
      border-radius: 50%;
      opacity: 0.95;
    }

    .loop.left {
      left: 4px;
    }

    .loop.right {
      right: 4px;
    }

    .spine {
      position: absolute;
      left: 50%;
      top: 12px;
      width: 36px;
      height: 136px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(210, 172, 95, 0.44);
    }

    .phone-card {
      position: absolute;
      right: 72px;
      bottom: 112px;
      width: 300px;
      height: 510px;
      border: 1px solid rgba(210, 172, 95, 0.32);
      border-radius: 42px;
      background:
        linear-gradient(130deg, rgba(210, 172, 95, 0.11), transparent 32%),
        linear-gradient(156deg, rgba(19, 18, 25, 0.96), rgba(5, 5, 8, 0.98));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.44);
      padding: 42px 32px;
      z-index: 1;
      opacity: 0.92;
    }

    .phone-card .mini-title {
      margin-top: 138px;
      font-size: 44px;
      line-height: 0.98;
      font-weight: 900;
    }

    .pill-row,
    .facet-grid,
    .signal-list {
      display: grid;
      gap: 18px;
    }

    .pill-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 830px;
    }

    .pill,
    .facet,
    .signal {
      border: 1px solid rgba(210, 172, 95, 0.23);
      background: rgba(18, 16, 22, 0.76);
      border-radius: 24px;
      padding: 24px;
    }

    .pill strong,
    .facet strong,
    .signal strong {
      display: block;
      color: var(--ink);
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .pill span,
    .facet span,
    .signal span {
      color: var(--muted);
      font-size: 22px;
      line-height: 1.25;
    }

    .facet-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 840px;
    }

    .signal-list {
      max-width: 820px;
    }

    .signal {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 22px;
    }

    .signal .num {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(210, 172, 95, 0.13);
      border: 1px solid rgba(210, 172, 95, 0.34);
      color: var(--gold);
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 23px;
    }

    .quote {
      color: var(--gold);
      font-size: 74px;
      line-height: 1.04;
      font-weight: 900;
      max-width: 860px;
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      color: var(--dim);
      font-family: "JetBrains Mono", monospace;
      font-size: 17px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .url {
      color: var(--gold);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const slides = [
      {
        kicker: "Transmission 024",
        body: `
          <div class="content">
            <div class="mirror-mark" aria-hidden="true"><span class="loop left"></span><span class="spine"></span><span class="loop right"></span></div>
            <h1>The Mirror<br />Found Its Form</h1>
            <p>Infinity Mirror is not becoming another wellness dashboard.</p>
          </div>
        `
      },
      {
        kicker: "The mistake",
        body: `
          <div class="content wide">
            <h2>Most wellness software asks the user to report themselves.</h2>
            <p>Mood. Habit. Journal. Progress. Category.</p>
            <p class="quiet">That can turn emotional work into administration.</p>
          </div>
        `
      },
      {
        kicker: "The new object",
        body: `
          <div class="content wide">
            <h2>A dark field. A gold signal. A mirror that changes when the user speaks.</h2>
            <p>The interface is not there to explain the human. It is there to receive the signal.</p>
          </div>
        `
      },
      {
        kicker: "Four facets",
        body: `
          <div class="content wide">
            <h2>One mirror. Four ways to touch it.</h2>
            <div class="facet-grid">
              <div class="facet"><strong>Talk</strong><span>Pressure release before analysis.</span></div>
              <div class="facet"><strong>Capture</strong><span>Raw signal before coherence.</span></div>
              <div class="facet"><strong>Map</strong><span>Recurrence without surveillance.</span></div>
              <div class="facet"><strong>Ritual</strong><span>Body route before explanation.</span></div>
            </div>
          </div>
        `
      },
      {
        kicker: "Permission",
        body: `
          <div class="content wide">
            <h2>"Just Talk" is not a feature.</h2>
            <p>It is a consent membrane. No tagging. No forced insight. No artifact unless the user chooses one.</p>
          </div>
        `
      },
      {
        kicker: "Consequence",
        body: `
          <div class="content wide">
            <h2>The product is the change in the mirror after the user speaks.</h2>
            <div class="signal-list">
              <div class="signal"><div class="num">01</div><div><strong>Signal enters</strong><span>One honest sentence.</span></div></div>
              <div class="signal"><div class="num">02</div><div><strong>Pattern wakes</strong><span>Memory checks recurrence.</span></div></div>
              <div class="signal"><div class="num">03</div><div><strong>Surface marks</strong><span>A gold seam appears.</span></div></div>
            </div>
          </div>
        `
      },
      {
        kicker: "Design gate",
        body: `
          <div class="content wide">
            <div class="quote">What did your signal change in the mirror?</div>
            <p>If a screen cannot answer that, it does not belong yet.</p>
          </div>
        `
      },
      {
        kicker: "Read the transmission",
        body: `
          <div class="content">
            <div class="mirror-mark" aria-hidden="true"><span class="loop left"></span><span class="spine"></span><span class="loop right"></span></div>
            <h2>Transmission 24 is live.</h2>
            <p>Read the full interactive design transmission on UnwindCode.ai.</p>
          </div>
        `
      }
    ];

    const root = document.getElementById("root");
    const slideNumber = Number((location.hash.match(/slide-(\d+)/) || [])[1] || 1);
    const index = Math.max(0, Math.min(slides.length - 1, slideNumber - 1));
    const slide = slides[index];

    root.innerHTML = `
      <section class="slide">
        <header class="top">
          <div class="brand"><span class="mark">&infin;</span><span>unwind<span class="accent">code</span></span></div>
          <div class="kicker">${slide.kicker}</div>
        </header>
        ${slide.body}
        <footer class="bottom">
          <span>${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</span>
          <span class="url">unwindcode.ai</span>
        </footer>
      </section>
    `;
  </script>
</body>
</html>
