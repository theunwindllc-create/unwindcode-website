name: Research Publication

on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research-publication.yml'
  pull_request:
    paths:
      - 'research/**'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy-research:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build research index
      run: |
        # Generate updated research index
        if [ -d "research" ]; then
          echo "📚 Building research index..."
          # Create a simple index page
          echo "# Research Publications" > research/README.md
          echo "" >> research/README.md
          echo "## Latest Research from Unwind Code" >> research/README.md
          echo "" >> research/README.md
          find research -name "*.md" -type f | sort -r | head -20 | while read file; do
            title=$(basename "$file" .md | sed 's/_/ /g' | sed 's/-/ /g')
            echo "- [$title]($file)" >> research/README.md
          done
          echo "" >> research/README.md
          echo "*Automatically generated by GitHub Actions*" >> research/README.md
        fi
        
    - name: Build website
      run: npm run build
      
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        
    - name: Notify completion
      if: success()
      run: |
        echo "✅ Research publication deployed successfully"
        echo "New research available at: https://unwindcode.ai/research/"