    <circle class="portal-node" cx="428" cy="236" r="6"/>
    <circle class="portal-node" cx="650" cy="236" r="6"/>
    <circle class="portal-node" cx="782" cy="260" r="8"/>
    <circle class="portal-node" cx="842" cy="390" r="5"/>
    <circle class="portal-node" cx="694" cy="470" r="7"/>
