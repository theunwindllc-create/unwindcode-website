    <path d="M218 349C260 425 336 458 404 443C470 428 514 374 563 313C617 247 667 210 733 217C803 225 856 272 855 330" fill="none" stroke="#eef1ff" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g opacity="0.64" stroke-linecap="round">
