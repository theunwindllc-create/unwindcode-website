<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="presentation" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="portal-core" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#f1d18a" stop-opacity="0.52"/>
      <stop offset="34%" stop-color="#1bc7b1" stop-opacity="0.24"/>
      <stop offset="68%" stop-color="#7c4dff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#020207" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portal-void" cx="50%" cy="46%" r="66%">
      <stop offset="0%" stop-color="#111a27" stop-opacity="0.95"/>
      <stop offset="54%" stop-color="#06101a" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#030308" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="portal-stroke" x1="180" y1="250" x2="900" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20d6bb" stop-opacity="0.28"/>
      <stop offset="42%" stop-color="#f1d18a" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#9d6cff" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#20d6bb" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="portal-reflection" x1="540" y1="392" x2="540" y2="642" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f1d18a" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#20d6bb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030308" stop-opacity="0"/>
    </linearGradient>
    <filter id="portal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.45 0 0 0 0.18 0 0.78 0 0 0.58 0 0 0.88 0 0.78 0 0 0 0.82 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="portal-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#eef1ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .portal-pulse{animation:portalPulse 7s ease-in-out infinite;transform-origin:540px 326px}
      .portal-drift{animation:portalDrift 11s ease-in-out infinite;transform-origin:center}
      .portal-node{animation:portalNode 5.4s ease-in-out infinite;transform-origin:center}
      .portal-node:nth-of-type(2n){animation-delay:.7s}
      .portal-node:nth-of-type(3n){animation-delay:1.2s}
      @keyframes portalPulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.018)}}
      @keyframes portalDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes portalNode{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
      @media (prefers-reduced-motion: reduce){.portal-pulse,.portal-drift,.portal-node{animation:none}}
    </style>
  </defs>
  <rect width="1080" height="720" fill="#030308"/>
  <rect x="44" y="44" width="992" height="632" rx="28" fill="url(#portal-void)" stroke="#eef1ff" stroke-opacity="0.08"/>
  <rect x="44" y="44" width="992" height="632" rx="28" fill="url(#portal-grid)" opacity="0.82"/>
  <circle cx="540" cy="330" r="288" fill="url(#portal-core)" opacity="0.78" class="portal-pulse"/>
  <g opacity="0.34">
    <ellipse cx="540" cy="526" rx="348" ry="58" fill="url(#portal-reflection)"/>
