<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="pulse-bg" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#173a42" stop-opacity="0.92" />
      <stop offset="54%" stop-color="#101827" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#07080f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pulse-line" x1="130" y1="360" x2="950" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#56d6c3" stop-opacity="0.08" />
      <stop offset="22%" stop-color="#56d6c3" stop-opacity="0.9" />
      <stop offset="58%" stop-color="#d7bb72" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1efe5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="gold-rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d38a" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#7fcfc1" stop-opacity="0.82" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02050a" flood-opacity="0.48" />
    </filter>
    <style>
      .field-ring {
        fill: none;
        stroke: rgba(127, 207, 193, 0.18);
        stroke-width: 1.2;
      }

      .field-rail {
        fill: none;
        stroke: url(#pulse-line);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 36 24;
        animation: rail-flow 9s linear infinite;
      }

      .field-rail-soft {
        fill: none;
        stroke: rgba(240, 211, 138, 0.16);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 14 16;
        animation: rail-flow 13s linear infinite reverse;
      }

      .node-core {
        filter: url(#soft-shadow);
      }

      .node-halo {
        fill: none;
        stroke: rgba(86, 214, 195, 0.18);
        stroke-width: 1.3;
        animation: halo-breathe 6s ease-in-out infinite;
        transform-origin: center;
      }

      .node-halo.gold {
        stroke: rgba(240, 211, 138, 0.22);
        animation-delay: -2s;
      }

      .pulse-dot {
        fill: #f0d38a;
        animation: dot-run 7.4s ease-in-out infinite;
      }

      .pulse-dot.secondary {
        fill: #56d6c3;
        animation-delay: -3.2s;
        opacity: 0.74;
      }

      .memory-arc {
        fill: none;
        stroke: rgba(241, 239, 229, 0.24);
        stroke-width: 1.4;
        stroke-dasharray: 4 12;
        animation: spin-memory 24s linear infinite;
        transform-origin: 540px 360px;
      }

      .gate-pane {
        fill: rgba(241, 239, 229, 0.035);
        stroke: rgba(240, 211, 138, 0.22);
        stroke-width: 1;
      }

      .signal-vane {
        fill: rgba(86, 214, 195, 0.12);
        stroke: rgba(86, 214, 195, 0.28);
        stroke-width: 1;
        animation: vane-drift 10s ease-in-out infinite;
      }

      .signal-vane.offset {
        animation-delay: -4s;
      }

      @keyframes rail-flow {
        to {
          stroke-dashoffset: -120;
        }
      }

      @keyframes halo-breathe {
        0%, 100% {
          opacity: 0.42;
          transform: scale(0.985);
        }
        50% {
          opacity: 0.82;
          transform: scale(1.035);
        }
      }

      @keyframes dot-run {
        0% {
          opacity: 0;
          transform: translateX(-290px);
        }
        12%, 82% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(286px);
        }
      }

      @keyframes spin-memory {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes vane-drift {
        0%, 100% {
          transform: translateY(0);
          opacity: 0.55;
        }
        50% {
          transform: translateY(-10px);
          opacity: 0.86;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .field-rail,
        .field-rail-soft,
        .node-halo,
        .pulse-dot,
        .memory-arc,
        .signal-vane {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1080" height="720" rx="32" fill="url(#pulse-bg)" />
  <path d="M118 110 C232 42 356 78 446 134 C563 207 663 148 760 102 C871 50 958 86 1010 160" fill="none" stroke="rgba(86,214,195,0.11)" stroke-width="2" />
  <path d="M84 596 C230 492 342 560 464 604 C603 654 701 574 812 520 C913 471 1006 514 1038 588" fill="none" stroke="rgba(240,211,138,0.12)" stroke-width="2" />

  <g opacity="0.96">
    <ellipse class="field-ring" cx="540" cy="360" rx="392" ry="214" />
    <ellipse class="field-ring" cx="540" cy="360" rx="306" ry="162" />
    <ellipse class="field-ring" cx="540" cy="360" rx="218" ry="112" />
    <path class="memory-arc" d="M248 360 C324 218 420 168 540 168 C660 168 762 220 832 360 C760 498 660 552 540 552 C420 552 324 502 248 360Z" />
  </g>

  <g fill="none">
    <path class="field-rail" d="M156 360 C252 286 336 286 420 338 C494 384 582 394 660 344 C758 282 850 304 924 360" />
    <path class="field-rail-soft" d="M174 438 C292 384 382 400 474 458 C562 512 658 494 742 426 C804 376 884 378 946 424" />
    <path class="field-rail-soft" d="M174 282 C292 336 382 320 474 262 C562 208 658 226 742 294 C804 344 884 342 946 296" />
  </g>

  <g transform="translate(540 360)">
    <circle r="108" fill="rgba(7, 11, 18, 0.72)" stroke="rgba(241,239,229,0.16)" stroke-width="1.2" />
    <circle class="node-halo" r="138" />
    <circle class="node-halo gold" r="82" />
    <path d="M-46 -12 C-24 -56 28 -54 52 -16 C72 16 48 60 0 66 C-50 60 -72 20 -46 -12Z" fill="rgba(86,214,195,0.16)" stroke="url(#gold-rail)" stroke-width="2" />
    <path d="M-30 8 C-12 -22 24 -22 38 4 C50 26 32 52 0 54 C-33 50 -48 28 -30 8Z" fill="rgba(240,211,138,0.12)" stroke="rgba(241,239,229,0.32)" stroke-width="1" />
    <circle r="12" fill="#f0d38a" opacity="0.92" />
  </g>

  <g class="node-core">
    <g transform="translate(194 360)">
      <circle class="node-halo" r="78" />
      <circle r="48" fill="rgba(12, 30, 37, 0.82)" stroke="rgba(86,214,195,0.34)" stroke-width="1.4" />
      <path d="M-18 -8 L8 -24 L24 8 L-2 24Z" fill="rgba(86,214,195,0.24)" stroke="rgba(86,214,195,0.66)" stroke-width="1.2" />
    </g>
    <g transform="translate(364 304)">
      <circle class="node-halo gold" r="58" />
      <circle r="36" fill="rgba(36, 30, 20, 0.78)" stroke="rgba(240,211,138,0.36)" stroke-width="1.2" />
      <path d="M-18 8 C-8 -18 10 -18 20 8 C6 20 -4 20 -18 8Z" fill="rgba(240,211,138,0.22)" stroke="rgba(240,211,138,0.62)" stroke-width="1.1" />
    </g>
    <g transform="translate(716 304)">
      <circle class="node-halo" r="58" />
      <circle r="36" fill="rgba(14, 25, 36, 0.8)" stroke="rgba(86,214,195,0.3)" stroke-width="1.2" />
      <path d="M-18 -10 H18 M-18 0 H18 M-18 10 H18" stroke="rgba(241,239,229,0.45)" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(884 360)">
      <circle class="node-halo gold" r="78" />
      <circle r="48" fill="rgba(34, 27, 18, 0.82)" stroke="rgba(240,211,138,0.38)" stroke-width="1.4" />
      <path d="M0 -26 L24 -10 V18 L0 30 L-24 18 V-10Z" fill="rgba(240,211,138,0.14)" stroke="rgba(240,211,138,0.64)" stroke-width="1.3" />
      <path d="M-10 0 L-2 10 L14 -12" fill="none" stroke="rgba(241,239,229,0.72)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g transform="translate(540 360)">
    <circle class="pulse-dot" r="7" />
    <circle class="pulse-dot secondary" r="5" />
  </g>

  <g opacity="0.9">
    <path class="gate-pane" d="M784 144 L946 194 L946 258 L784 208Z" />
    <path class="gate-pane" d="M134 480 L296 528 L296 594 L134 544Z" />
    <path class="signal-vane" d="M732 478 L836 444 L900 510 L796 544Z" />
    <path class="signal-vane offset" d="M196 206 L298 174 L360 238 L258 272Z" />
  </g>
</svg>
