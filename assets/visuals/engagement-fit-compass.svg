<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="presentation" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="efc-core" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#d6a84f" stop-opacity=".28"/>
      <stop offset="42%" stop-color="#0d9488" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="efc-line" x1="10%" y1="8%" x2="92%" y2="90%">
      <stop offset="0%" stop-color="#7fcfc1" stop-opacity=".82"/>
      <stop offset="50%" stop-color="#d6a84f" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#9b59f5" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="efc-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0eef6" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#f0eef6" stop-opacity=".02"/>
    </linearGradient>
    <filter id="efc-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .efc-grid { stroke: rgba(240,238,246,.075); stroke-width: 1; }
      .efc-ring { fill: none; stroke: url(#efc-line); stroke-width: 1.5; opacity: .42; }
      .efc-route { fill: none; stroke: url(#efc-line); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .68; }
      .efc-dash { stroke-dasharray: 16 22; animation: efc-dash 20s linear infinite; }
      .efc-panel { fill: url(#efc-panel); stroke: rgba(240,238,246,.16); stroke-width: 1; }
      .efc-node { fill: #07111b; stroke: url(#efc-line); stroke-width: 2; filter: url(#efc-glow); }
      .efc-dot { fill: #7fcfc1; filter: url(#efc-glow); }
      .efc-gold { fill: #d6a84f; filter: url(#efc-glow); }
      .efc-violet { fill: #9b59f5; filter: url(#efc-glow); }
      .efc-float-a { animation: efc-float-a 10s ease-in-out infinite; transform-origin: center; }
      .efc-float-b { animation: efc-float-b 12s ease-in-out infinite; transform-origin: center; }
      .efc-pulse { animation: efc-pulse 5.4s ease-in-out infinite; transform-origin: center; }
      @keyframes efc-dash { to { stroke-dashoffset: -260; } }
      @keyframes efc-float-a { 50% { transform: translate3d(0,-12px,0) scale(1.01); } }
      @keyframes efc-float-b { 50% { transform: translate3d(10px,7px,0) scale(.994); } }
      @keyframes efc-pulse { 50% { opacity: .46; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .efc-dash, .efc-float-a, .efc-float-b, .efc-pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1080" height="720" fill="#06060c"/>
