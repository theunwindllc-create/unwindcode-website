<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="fit-bg" cx="52%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#1c1730" stop-opacity="0.88"/>
      <stop offset="52%" stop-color="#0b1018" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fit-rail-a" x1="180" y1="112" x2="900" y2="608" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#d6a84f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9b59f5" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="fit-rail-b" x1="188" y1="606" x2="898" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b59f5" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d6a84f" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="fit-glow" x="-24%" y="-24%" width="148%" height="148%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.56 0 0 0 0 0.42 0 0 0 0 0.74 0 0 0 0.28 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .fit-grid { fill: none; stroke: rgba(240, 238, 246, 0.1); stroke-width: 1; }
      .fit-rail { fill: none; stroke-linecap: round; stroke-width: 2; stroke-dasharray: 18 20; animation: fit-drift 16s linear infinite; }
      .fit-node { filter: url(#fit-glow); transform-origin: center; animation: fit-pulse 6s ease-in-out infinite; }
      .fit-node:nth-of-type(2) { animation-delay: -1.2s; }
      .fit-node:nth-of-type(3) { animation-delay: -2.4s; }
      .fit-node:nth-of-type(4) { animation-delay: -3.6s; }
      @keyframes fit-drift { to { stroke-dashoffset: -280; } }
      @keyframes fit-pulse {
        0%, 100% { opacity: 0.74; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fit-rail, .fit-node { animation: none; }
      }
    </style>
  </defs>
  <rect width="1080" height="720" fill="url(#fit-bg)"/>
