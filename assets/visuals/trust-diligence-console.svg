<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="presentation" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="tdc-core" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#7fcfc1" stop-opacity=".24"/>
      <stop offset="42%" stop-color="#6e2dbe" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tdc-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fcfc1" stop-opacity=".8"/>
      <stop offset="52%" stop-color="#d6a84f" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#9b59f5" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="tdc-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0eef6" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#f0eef6" stop-opacity=".02"/>
    </linearGradient>
    <filter id="tdc-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .tdc-grid { stroke: rgba(240,238,246,.08); stroke-width: 1; }
      .tdc-ring { fill: none; stroke: url(#tdc-line); stroke-width: 1.6; opacity: .46; }
      .tdc-line { stroke: url(#tdc-line); stroke-width: 2.2; stroke-linecap: round; opacity: .7; }
      .tdc-panel { fill: url(#tdc-panel); stroke: rgba(240,238,246,.16); stroke-width: 1; }
      .tdc-node { fill: #07111b; stroke: url(#tdc-line); stroke-width: 2; filter: url(#tdc-glow); }
      .tdc-dot { fill: #7fcfc1; filter: url(#tdc-glow); }
      .tdc-gold { fill: #d6a84f; }
      .tdc-violet { fill: #9b59f5; }
      .tdc-stream { stroke-dasharray: 14 20; animation: tdc-dash 18s linear infinite; }
      .tdc-float-a { animation: tdc-float-a 9s ease-in-out infinite; transform-origin: center; }
      .tdc-float-b { animation: tdc-float-b 11s ease-in-out infinite; transform-origin: center; }
      .tdc-pulse { animation: tdc-pulse 4.8s ease-in-out infinite; transform-origin: center; }
      @keyframes tdc-dash { to { stroke-dashoffset: -220; } }
      @keyframes tdc-float-a { 50% { transform: translate3d(0,-10px,0) scale(1.012); } }
      @keyframes tdc-float-b { 50% { transform: translate3d(8px,6px,0) scale(.992); } }
      @keyframes tdc-pulse { 50% { opacity: .42; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .tdc-stream, .tdc-float-a, .tdc-float-b, .tdc-pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1080" height="720" fill="#06060c"/>
