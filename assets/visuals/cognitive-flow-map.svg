  <path class="flow" d="M162 152 C308 104 432 118 540 214 C650 312 766 342 918 154" stroke="url(#pathA)"/>
  <path class="flow return" d="M918 566 C760 624 642 596 540 506 C430 410 306 384 162 566" stroke="url(#pathB)"/>
  <path class="flow" d="M196 360 C304 250 420 226 540 360 C660 494 782 466 884 360" stroke="url(#pathA)" opacity="0.64"/>
  <g class="node">
