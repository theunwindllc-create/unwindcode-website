    <circle cx="162" cy="566" r="42" fill="rgba(240, 238, 246, 0.045)" stroke="rgba(240, 238, 246, 0.22)" stroke-width="1"/>
    <circle cx="540" cy="506" r="50" fill="rgba(13, 148, 136, 0.1)" stroke="rgba(13, 148, 136, 0.38)" stroke-width="1"/>
    <circle cx="918" cy="566" r="42" fill="rgba(155, 89, 245, 0.1)" stroke="rgba(155, 89, 245, 0.36)" stroke-width="1"/>
  </g>
  <g class="pulse">
