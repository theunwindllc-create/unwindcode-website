<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="doctrineGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#d6a84f" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#7fcfc1" stop-opacity=".14"/>
      <stop offset="1" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doctrineStroke" x1="160" x2="920" y1="120" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fcfc1" stop-opacity=".68"/>
      <stop offset=".5" stop-color="#d6a84f" stop-opacity=".78"/>
      <stop offset="1" stop-color="#9b59f5" stop-opacity=".62"/>
    </linearGradient>
    <filter id="doctrineSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .grid { stroke: rgba(240,238,246,.052); stroke-width: 1; }
      .orbit { fill: none; stroke: rgba(240,238,246,.12); stroke-width: 1.2; }
      .axis { fill: none; stroke: url(#doctrineStroke); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 34 16; animation: doctrine-dash 18s linear infinite; }
      .node-ring { fill: rgba(6,6,12,.82); stroke: rgba(240,238,246,.18); stroke-width: 1.4; }
      .node-core { filter: url(#doctrineSoftGlow); animation: doctrine-pulse 5.6s ease-in-out infinite; transform-origin: center; }
      .node-core:nth-of-type(2n) { animation-delay: -1.6s; }
      .shield { fill: rgba(214,168,79,.08); stroke: rgba(214,168,79,.42); stroke-width: 3; filter: url(#doctrineSoftGlow); }
      .boundary { fill: none; stroke: rgba(127,207,193,.28); stroke-width: 2; stroke-dasharray: 12 12; animation: doctrine-breathe 7s ease-in-out infinite; transform-origin: center; }
      .proof { fill: rgba(240,238,246,.1); stroke: rgba(240,238,246,.26); stroke-width: 1.2; }
      @keyframes doctrine-dash { to { stroke-dashoffset: -220; } }
      @keyframes doctrine-pulse {
        0%, 100% { opacity: .64; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes doctrine-breathe {
        0%, 100% { opacity: .52; transform: scale(.98); }
        50% { opacity: .86; transform: scale(1.025); }
      }
      @media (prefers-reduced-motion: reduce) {
        .axis, .node-core, .boundary { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1080" height="680" fill="#06060c" opacity=".02"/>
  <circle cx="540" cy="340" r="398" fill="url(#doctrineGlow)"/>
  <g opacity=".55">
