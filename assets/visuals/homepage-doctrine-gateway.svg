    <circle class="node-ring" cx="288" cy="340" r="44"/>
    <circle class="node-core" cx="288" cy="340" r="14" fill="#7fcfc1"/>
    <circle class="node-ring" cx="540" cy="340" r="54"/>
    <circle class="node-core" cx="540" cy="340" r="17" fill="#f0eef6"/>
  </g>
  <g opacity=".72">
