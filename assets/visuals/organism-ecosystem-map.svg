<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="void" cx="50%" cy="48%" r="64%">
      <stop offset="0%" stop-color="#1b1430" stop-opacity="0.92"/>
      <stop offset="48%" stop-color="#0b0c16" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="110" y1="120" x2="840" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b59f5" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#d6a84f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="teal" x1="120" y1="580" x2="820" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="0.52" stop-color="#9b59f5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d6a84f" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.58 0 0 0 0 0.28 0 0 0 0 0.95 0 0 0 0.34 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ring { fill: none; stroke: rgba(240, 238, 246, 0.14); stroke-width: 1; }
      .flow { fill: none; stroke-linecap: round; stroke-width: 2; stroke-dasharray: 16 18; animation: drift 14s linear infinite; }
      .node { filter: url(#soft-glow); }
      .pulse { animation: pulse 5.6s ease-in-out infinite; transform-origin: center; }
      @keyframes drift { to { stroke-dashoffset: -260; } }
      @keyframes pulse {
        0%, 100% { opacity: 0.74; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
