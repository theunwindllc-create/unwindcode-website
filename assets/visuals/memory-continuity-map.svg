<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="memory-bg" x1="80" y1="72" x2="920" y2="568" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#d6a84f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9b59f5" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="memory-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d58b"/>
      <stop offset="1" stop-color="#8c6b2e"/>
    </linearGradient>
    <linearGradient id="memory-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26c6b8"/>
      <stop offset="1" stop-color="#0d615b"/>
    </linearGradient>
    <linearGradient id="memory-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b78cff"/>
      <stop offset="1" stop-color="#5d2c96"/>
    </linearGradient>
    <radialGradient id="memory-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0eef6" stop-opacity=".9"/>
      <stop offset=".28" stop-color="#d6a84f" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <filter id="memory-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .rail{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .pulse{animation:memory-pulse 6s ease-in-out infinite}
      .orbit{animation:memory-orbit 18s linear infinite;transform-origin:520px 320px}
      .float-a{animation:memory-float-a 9s ease-in-out infinite}
      .float-b{animation:memory-float-b 11s ease-in-out infinite}
      .dash{animation:memory-dash 12s linear infinite}
      @keyframes memory-pulse{0%,100%{opacity:.34;transform:scale(.98)}50%{opacity:.82;transform:scale(1.04)}}
      @keyframes memory-orbit{to{transform:rotate(360deg)}}
      @keyframes memory-float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes memory-float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
      @keyframes memory-dash{to{stroke-dashoffset:-220}}
      @media (prefers-reduced-motion: reduce){
        .pulse,.orbit,.float-a,.float-b,.dash{animation:none!important}
      }
    </style>
  </defs>

  <rect x="44" y="54" width="952" height="532" rx="34" fill="#080912" opacity=".96"/>
  <rect x="70" y="84" width="900" height="472" rx="28" fill="url(#memory-bg)" opacity=".5"/>
  <path d="M104 320c110-124 246-164 408-118 161 45 234 198 424 86" class="rail dash" stroke="#0d9488" stroke-width="2" stroke-dasharray="12 20" opacity=".45"/>
  <path d="M112 410c146-70 252-54 382 20 139 80 268 76 438-26" class="rail dash" stroke="#d6a84f" stroke-width="2" stroke-dasharray="10 18" opacity=".38"/>
  <path d="M140 232c132 28 202 76 290 144 120 94 276 118 462-6" class="rail dash" stroke="#9b59f5" stroke-width="2" stroke-dasharray="8 18" opacity=".4"/>

  <g opacity=".24">
    <path d="M116 138h808M116 502h808" stroke="#f0eef6"/>
    <path d="M196 118v404M332 118v404M468 118v404M604 118v404M740 118v404M876 118v404" stroke="#f0eef6" opacity=".32"/>
  </g>

  <g class="orbit" opacity=".38">
    <circle cx="520" cy="320" r="152" fill="none" stroke="#f0eef6" stroke-width="1"/>
    <circle cx="520" cy="168" r="5" fill="#d6a84f"/>
    <circle cx="672" cy="320" r="5" fill="#0d9488"/>
    <circle cx="520" cy="472" r="5" fill="#9b59f5"/>
    <circle cx="368" cy="320" r="5" fill="#f0eef6"/>
  </g>

  <circle class="pulse" cx="520" cy="320" r="124" fill="url(#memory-core)" filter="url(#memory-soft)" opacity=".72"/>
  <g class="float-a">
    <rect x="436" y="236" width="168" height="168" rx="28" fill="#06060c"/>
    <path d="M520 272v96M472 320h96M486 286l68 68M554 286l-68 68" stroke="url(#memory-teal)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="520" cy="320" r="8" fill="url(#memory-gold)"/>
  </g>

  <g class="float-b">
    <rect x="132" y="258" width="150" height="158" rx="24" fill="#06060c"/>
    <path d="M168 302h78M168 334h58M168 366h74" stroke="url(#memory-teal)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="142" cy="334" r="5" fill="#f2d58b"/>
  </g>

  <g class="float-a">
    <rect x="328" y="160" width="172" height="126" rx="24" fill="#06060c"/>
    <path d="M370 202h88M370 234h54" stroke="url(#memory-gold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M486 188l28 28-28 28" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
  </g>

  <g class="float-b">
    <rect x="656" y="162" width="172" height="126" rx="24" fill="#06060c"/>
    <path d="M710 202h68M696 232h94" stroke="url(#memory-violet)" stroke-width="3" stroke-linecap="round"/>
    <path d="M734 188l64 38-64 38-64-38z" fill="none" stroke="url(#memory-violet)" stroke-width="3"/>
  </g>

  <g class="float-a">
    <rect x="744" y="356" width="168" height="136" rx="24" fill="#06060c"/>
    <path d="M782 420l32 32 66-84" fill="none" stroke="url(#memory-gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="846" cy="420" r="5" fill="#f2d58b"/>
  </g>

  <g class="float-b">
    <rect x="326" y="438" width="180" height="82" rx="22" fill="#06060c"/>
    <path d="M370 472h92M370 494h54" stroke="url(#memory-gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="484" cy="482" r="6" fill="#0d9488"/>
  </g>

  <g opacity=".48">
    <circle cx="110" cy="156" r="3" fill="#f0eef6"/>
    <circle cx="206" cy="148" r="4" fill="#d6a84f"/>
    <circle cx="532" cy="124" r="3" fill="#f0eef6"/>
    <circle cx="912" cy="160" r="3" fill="#f0eef6"/>
    <circle cx="118" cy="506" r="3" fill="#f0eef6"/>
    <circle cx="522" cy="526" r="3" fill="#f0eef6"/>
    <circle cx="890" cy="504" r="4" fill="#d6a84f"/>
  </g>
</svg>
