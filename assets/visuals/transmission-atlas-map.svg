<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="atlas-bg" x1="78" y1="96" x2="1008" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#d6a84f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6e2dbe" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="atlas-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d4c7"/>
      <stop offset="1" stop-color="#0d615b"/>
    </linearGradient>
    <linearGradient id="atlas-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d990"/>
      <stop offset="1" stop-color="#8f6c2d"/>
    </linearGradient>
    <linearGradient id="atlas-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b488ff"/>
      <stop offset="1" stop-color="#5c2b92"/>
    </linearGradient>
    <radialGradient id="atlas-core" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#f0eef6" stop-opacity=".78"/>
      <stop offset=".32" stop-color="#d6a84f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <filter id="atlas-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .atlas-route{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .atlas-pulse{animation:atlas-pulse 6.5s ease-in-out infinite}
      .atlas-dash{animation:atlas-dash 15s linear infinite}
      .atlas-float-a{animation:atlas-float-a 10s ease-in-out infinite}
      .atlas-float-b{animation:atlas-float-b 12s ease-in-out infinite}
      @keyframes atlas-pulse{0%,100%{opacity:.32;transform:scale(.98)}50%{opacity:.78;transform:scale(1.05)}}
      @keyframes atlas-dash{to{stroke-dashoffset:-260}}
      @keyframes atlas-float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
      @keyframes atlas-float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
      @media (prefers-reduced-motion: reduce){
        .atlas-pulse,.atlas-dash,.atlas-float-a,.atlas-float-b{animation:none!important}
      }
    </style>
  </defs>

  <rect x="48" y="54" width="984" height="552" rx="36" fill="#080912" opacity=".96"/>
  <rect x="78" y="86" width="924" height="488" rx="30" fill="url(#atlas-bg)" opacity=".58"/>

  <g opacity=".2">
    <path d="M136 150h808M136 250h808M136 350h808M136 450h808" stroke="#f0eef6"/>
    <path d="M178 120v410M330 120v410M482 120v410M634 120v410M786 120v410M938 120v410" stroke="#f0eef6" opacity=".42"/>
  </g>

  <path d="M150 424c120-142 250-172 386-92 156 92 268 42 386-126" class="atlas-route atlas-dash" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="12 18" opacity=".46"/>
  <path d="M154 226c116 20 204 80 304 154 134 98 304 106 454-38" class="atlas-route atlas-dash" stroke="#d6a84f" stroke-width="2.2" stroke-dasharray="10 19" opacity=".42"/>
  <path d="M164 512c182-100 314-96 430-24 122 76 226 44 334-78" class="atlas-route atlas-dash" stroke="#9b59f5" stroke-width="2" stroke-dasharray="8 18" opacity=".38"/>

  <circle class="atlas-pulse" cx="542" cy="332" r="145" fill="url(#atlas-core)" filter="url(#atlas-soft)" opacity=".68"/>

  <g class="atlas-float-a">
    <rect x="432" y="214" width="222" height="196" rx="32" fill="#06060c"/>
    <path d="M470 270h122M470 306h86M470 342h118" stroke="url(#atlas-gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M486 382h112" stroke="url(#atlas-teal)" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <circle cx="622" cy="286" r="9" fill="#d6a84f"/>
    <circle cx="622" cy="342" r="7" fill="#0d9488"/>
  </g>

  <g class="atlas-float-b">
    <rect x="142" y="182" width="170" height="136" rx="24" fill="#06060c"/>
    <path d="M178 230h84M178 260h58" stroke="url(#atlas-teal)" stroke-width="3" stroke-linecap="round"/>
    <path d="M276 218l30 30-30 30" fill="none" stroke="url(#atlas-gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="atlas-float-a">
    <rect x="268" y="404" width="184" height="118" rx="24" fill="#06060c"/>
    <path d="M306 450h92M306 480h56" stroke="url(#atlas-violet)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="414" cy="456" r="7" fill="#b488ff"/>
  </g>

  <g class="atlas-float-b">
    <rect x="640" y="132" width="190" height="132" rx="24" fill="#06060c"/>
    <path d="M682 182h94M682 214h62" stroke="url(#atlas-gold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M796 170l28 28-28 28" fill="none" stroke="url(#atlas-teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="atlas-float-a">
    <rect x="768" y="344" width="174" height="148" rx="24" fill="#06060c"/>
    <path d="M810 398h82M810 430h48" stroke="url(#atlas-teal)" stroke-width="3" stroke-linecap="round"/>
    <path d="M856 468l38-52 38 52" fill="none" stroke="url(#atlas-gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="atlas-float-b">
    <rect x="562" y="438" width="176" height="82" rx="22" fill="#06060c"/>
    <path d="M596 474h88M596 496h52" stroke="url(#atlas-gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="704" cy="486" r="6" fill="#0d9488"/>
  </g>

  <g opacity=".48">
    <circle cx="134" cy="142" r="3" fill="#f0eef6"/>
    <circle cx="244" cy="536" r="4" fill="#d6a84f"/>
    <circle cx="368" cy="148" r="3" fill="#f0eef6"/>
    <circle cx="544" cy="118" r="4" fill="#d6a84f"/>
    <circle cx="820" cy="524" r="3" fill="#f0eef6"/>
    <circle cx="950" cy="156" r="4" fill="#0d9488"/>
  </g>
</svg>
