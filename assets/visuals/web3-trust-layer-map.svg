<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="trustLine" x1="86" x2="954" y1="310" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488" stop-opacity=".1"/>
      <stop offset=".26" stop-color="#0d9488" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#e9cf97" stop-opacity=".78"/>
      <stop offset=".76" stop-color="#9b59f5" stop-opacity=".36"/>
      <stop offset="1" stop-color="#9b59f5" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="offChainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity=".58"/>
      <stop offset="65%" stop-color="#0d9488" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="approvalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9cf97" stop-opacity=".7"/>
      <stop offset="55%" stop-color="#e9cf97" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lockedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b59f5" stop-opacity=".38"/>
      <stop offset="70%" stop-color="#9b59f5" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurLarge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <style>
    .rail {
      fill: none;
      stroke: url(#trustLine);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 14 18;
      animation: rail-shift 22s linear infinite;
    }

    .pulse {
      transform-origin: center;
      animation: pulse-node 8s ease-in-out infinite;
    }

    .approval {
      animation-delay: -2.8s;
    }

    .locked {
      animation-delay: -5.6s;
    }

    .packet {
      fill: #e9cf97;
      opacity: .78;
      animation: packet-blink 3.8s ease-in-out infinite;
    }

    .packet:nth-of-type(odd) {
      animation-delay: -1.9s;
    }

    @keyframes rail-shift {
      to { stroke-dashoffset: -240; }
    }

    @keyframes pulse-node {
      0%, 100% { opacity: .42; transform: scale(.96); }
      50% { opacity: .82; transform: scale(1.06); }
    }

    @keyframes packet-blink {
      0%, 100% { opacity: .22; transform: scale(.72); }
      50% { opacity: .88; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rail,
      .pulse,
      .packet {
        animation: none !important;
      }
    }
  </style>

  <rect x="42" y="54" width="956" height="512" rx="34" fill="#080812" opacity=".34"/>
  <path d="M112 110h816c38 0 68 30 68 68v264c0 38-30 68-68 68H112c-38 0-68-30-68-68V178c0-38 30-68 68-68Z" fill="none" stroke="#f0eef6" stroke-opacity=".07"/>
  <path d="M82 310h876" stroke="#f0eef6" stroke-opacity=".06"/>
  <path d="M348 116v388M692 116v388" stroke="#f0eef6" stroke-opacity=".045"/>

  <g opacity=".98">
    <path class="rail" d="M112 310C204 232 288 228 348 310S498 402 520 310s150-92 172 0 140 92 236 0"/>
    <path d="M348 116c0 118 0 270 0 388" stroke="#0d9488" stroke-opacity=".18" stroke-width="1.2" stroke-dasharray="8 12"/>
    <path d="M692 116c0 118 0 270 0 388" stroke="#e9cf97" stroke-opacity=".2" stroke-width="1.2" stroke-dasharray="8 12"/>
  </g>

  <g>
    <circle class="pulse" cx="220" cy="310" r="88" fill="url(#offChainGlow)" filter="url(#blurLarge)"/>
    <circle class="pulse approval" cx="520" cy="310" r="102" fill="url(#approvalGlow)" filter="url(#blurLarge)"/>
    <circle class="pulse locked" cx="824" cy="310" r="92" fill="url(#lockedGlow)" filter="url(#blurLarge)"/>
  </g>

  <g fill="#06060c" stroke="#f0eef6" stroke-opacity=".16">
    <rect x="144" y="234" width="152" height="152" rx="22"/>
    <rect x="444" y="222" width="152" height="176" rx="22"/>
    <rect x="748" y="234" width="152" height="152" rx="22"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 286h60M190 310h60M190 334h38" stroke="#0d9488" stroke-opacity=".86" stroke-width="2.4"/>
    <path d="M502 272h36c14 0 25 11 25 25v40c0 14-11 25-25 25h-36c-14 0-25-11-25-25v-40c0-14 11-25 25-25Z" stroke="#e9cf97" stroke-opacity=".8" stroke-width="2.2"/>
    <path d="M493 316l18 18 36-44" stroke="#e9cf97" stroke-opacity=".86" stroke-width="2.6"/>
    <path d="M798 304v-20c0-15 12-27 27-27s27 12 27 27v20" stroke="#9b59f5" stroke-opacity=".78" stroke-width="2.4"/>
    <path d="M790 304h70v54h-70Z" stroke="#9b59f5" stroke-opacity=".78" stroke-width="2.4"/>
    <path d="M824 322v18" stroke="#9b59f5" stroke-opacity=".78" stroke-width="2.4"/>
  </g>

  <g>
    <circle class="packet" cx="142" cy="310" r="4.2"/>
    <circle class="packet" cx="348" cy="310" r="4"/>
    <circle class="packet" cx="520" cy="310" r="4.8"/>
    <circle class="packet" cx="692" cy="310" r="4"/>
    <circle class="packet" cx="888" cy="310" r="4.2"/>
  </g>

  <g fill="#f0eef6" opacity=".18">
    <circle cx="110" cy="144" r="2"/>
    <circle cx="156" cy="178" r="1.6"/>
    <circle cx="900" cy="150" r="2"/>
    <circle cx="936" cy="454" r="1.7"/>
    <circle cx="96" cy="466" r="1.5"/>
    <circle cx="506" cy="132" r="1.8"/>
  </g>
</svg>
