<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transmission 25 Instagram Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #04060a;
      --field: #081116;
      --glass: rgba(14, 25, 30, 0.78);
      --glass-strong: rgba(18, 30, 34, 0.9);
      --ink: #f4efe4;
      --muted: rgba(244, 239, 228, 0.68);
      --quiet: rgba(244, 239, 228, 0.38);
      --jade: #62d6c6;
      --jade-soft: rgba(98, 214, 198, 0.2);
      --gold: #e2c070;
      --gold-soft: rgba(226, 192, 112, 0.2);
      --coral: #e48768;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #010203;
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .slide {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      padding: 68px;
      background:
        radial-gradient(circle at 24% 22%, rgba(98, 214, 198, 0.17), transparent 28%),
        radial-gradient(circle at 78% 84%, rgba(226, 192, 112, 0.15), transparent 29%),
        linear-gradient(142deg, #0a151a 0%, #05080d 52%, #010203 100%);
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 42px;
      border: 1px solid rgba(226, 192, 112, 0.22);
      border-radius: 38px;
      pointer-events: none;
      z-index: 2;
    }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(116deg, transparent 0 31%, rgba(98, 214, 198, 0.13) 31.1%, transparent 31.6% 64%, rgba(226, 192, 112, 0.12) 64.1%, transparent 64.6%),
        radial-gradient(circle, rgba(244, 239, 228, 0.13) 0 1px, transparent 1.6px);
      background-size: auto, 44px 44px;
      opacity: 0.44;
      pointer-events: none;
      z-index: 1;
    }

    .top,
    .content,
    .bottom,
    .pulse-field,
    .orbit,
    .proof-stack,
    .gate-map {
      position: relative;
      z-index: 3;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 46px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--ink);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(98, 214, 198, 0.42);
      border-radius: 50%;
      color: var(--jade);
      font-family: "JetBrains Mono", monospace;
      font-size: 16px;
      box-shadow: 0 0 28px rgba(98, 214, 198, 0.16);
    }

    .brand span span {
      color: var(--jade);
    }

    .kicker {
      color: var(--gold);
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .content {
      display: grid;
      align-content: center;
      gap: 30px;
      max-width: 790px;
    }

    .content.wide {
      max-width: 900px;
    }

    .content.right {
      justify-self: end;
      max-width: 635px;
    }

    h1,
    h2 {
      color: var(--ink);
      font-weight: 900;
      letter-spacing: 0;
    }

    h1 {
      font-size: 90px;
      line-height: 0.94;
      max-width: 720px;
    }

    h2 {
      font-size: 74px;
      line-height: 0.98;
      max-width: 880px;
    }

    p {
      max-width: 800px;
      color: var(--muted);
      font-size: 34px;
      font-weight: 500;
      line-height: 1.24;
    }

    .accent {
      color: var(--gold);
    }

    .jade {
      color: var(--jade);
    }

    .microcopy {
      color: var(--quiet);
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pulse-field {
      position: absolute;
      right: -110px;
      bottom: 116px;
      width: 640px;
      opacity: 0.82;
      filter: drop-shadow(0 28px 70px rgba(0, 0, 0, 0.56));
      z-index: 2;
    }

    .pulse-field.large {
      right: -72px;
      top: 160px;
      bottom: auto;
      width: 690px;
      opacity: 0.54;
    }

    .pulse-field img {
      display: block;
      width: 100%;
      height: auto;
    }

    .orbit {
      position: absolute;
      right: 86px;
      top: 244px;
      width: 332px;
      height: 332px;
      border: 1px solid rgba(98, 214, 198, 0.22);
      border-radius: 50%;
      box-shadow:
        inset 0 0 44px rgba(98, 214, 198, 0.08),
        0 0 70px rgba(226, 192, 112, 0.1);
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      inset: 54px;
      border: 1px dashed rgba(226, 192, 112, 0.24);
    }

    .orbit::after {
      inset: 120px;
      border-style: solid;
      background: radial-gradient(circle, rgba(226, 192, 112, 0.9), rgba(98, 214, 198, 0.2) 38%, transparent 68%);
      border-color: rgba(244, 239, 228, 0.18);
    }

    .flow-list,
    .proof-stack,
    .gate-map {
      display: grid;
      gap: 16px;
    }

    .flow-list {
      max-width: 730px;
      margin-top: 8px;
    }

    .flow-item,
    .proof-item,
    .gate-item {
      display: grid;
      align-items: center;
      background: var(--glass);
      border: 1px solid rgba(98, 214, 198, 0.18);
      border-radius: 22px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.22);
    }

    .flow-item {
      grid-template-columns: 72px 1fr;
      gap: 20px;
      min-height: 102px;
      padding: 18px 24px;
    }

    .num {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      border: 1px solid rgba(226, 192, 112, 0.36);
      border-radius: 50%;
      background: rgba(226, 192, 112, 0.1);
      color: var(--gold);
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      font-weight: 800;
    }

    .flow-item strong,
    .proof-item strong,
    .gate-item strong {
      display: block;
      color: var(--ink);
      font-size: 29px;
      font-weight: 900;
      line-height: 1.04;
      margin-bottom: 5px;
    }

    .flow-item span,
    .proof-item span,
    .gate-item span {
      display: block;
      color: var(--muted);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.24;
    }

    .proof-stack {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 850px;
      margin-top: 8px;
    }

    .proof-item {
      min-height: 156px;
      align-content: start;
      padding: 24px;
      border-color: rgba(226, 192, 112, 0.2);
      background: rgba(16, 21, 25, 0.82);
    }

    .proof-item .tag {
      color: var(--gold);
      font-family: "JetBrains Mono", monospace;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .gate-map {
      max-width: 780px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 4px;
    }

    .gate-item {
      min-height: 138px;
      padding: 24px;
      border-color: rgba(228, 135, 104, 0.28);
      background: rgba(26, 17, 17, 0.74);
    }

    .gate-item strong {
      color: #ffd5c7;
    }

    .gate-item:last-child {
      border-color: rgba(98, 214, 198, 0.34);
      background: rgba(11, 30, 29, 0.76);
    }

    .callout {
      display: inline-grid;
      width: fit-content;
      max-width: 780px;
      gap: 12px;
      padding: 28px 32px;
      background: rgba(4, 6, 10, 0.5);
      border: 1px solid rgba(226, 192, 112, 0.24);
      border-radius: 28px;
    }

    .callout strong {
      color: var(--gold);
      font-size: 30px;
      font-weight: 900;
      line-height: 1.1;
    }

    .callout span {
      color: var(--muted);
      font-size: 23px;
      line-height: 1.22;
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      color: var(--quiet);
      font-family: "JetBrains Mono", monospace;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .url {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const pulseAsset = "../../assets/visuals/organism-pulse-field.svg";

    const slides = [
      {
        kicker: "Transmission 025",
        body: `
          <div class="pulse-field" aria-hidden="true"><img src="${pulseAsset}" alt="" /></div>
          <div class="content">
            <span class="microcopy">AI organisms / public proof</span>
            <h1>The homepage learned to <span class="accent">pulse.</span></h1>
            <p>Signal enters. Cortex routes. Memory shapes. Proof remains.</p>
          </div>
        `
      },
      {
        kicker: "Operating loop",
        body: `
          <div class="orbit" aria-hidden="true"></div>
          <div class="content wide">
            <h2>Organisms, not app wrappers.</h2>
            <p>The hero shows governed AI work moving from intent to inspectable architecture.</p>
            <div class="flow-list">
              <div class="flow-item"><div class="num">01</div><div><strong>Signal</strong><span>Visitor intent enters the gateway.</span></div></div>
              <div class="flow-item"><div class="num">02</div><div><strong>Cortex</strong><span>Context, tools, and cells are chosen.</span></div></div>
              <div class="flow-item"><div class="num">03</div><div><strong>Memory</strong><span>Prior proof shapes the response.</span></div></div>
            </div>
          </div>
        `
      },
      {
        kicker: "Proof surface",
        body: `
          <div class="pulse-field large" aria-hidden="true"><img src="${pulseAsset}" alt="" /></div>
          <div class="content wide">
            <h2>Premium means <span class="jade">provable.</span></h2>
            <p>Cinematic visuals stay textless. Meaning lives where humans and machines can inspect it.</p>
            <div class="proof-stack">
              <div class="proof-item"><div class="tag">HTML</div><strong>Readable meaning</strong><span>The copy carries the architecture.</span></div>
              <div class="proof-item"><div class="tag">Schema</div><strong>Machine context</strong><span>Search and agents can parse it.</span></div>
              <div class="proof-item"><div class="tag">Manifest</div><strong>Asset purpose</strong><span>Every visual has a job.</span></div>
              <div class="proof-item"><div class="tag">Tests</div><strong>Regression guard</strong><span>Proof survives the next build.</span></div>
            </div>
          </div>
        `
      },
      {
        kicker: "Authority boundary",
        body: `
          <div class="content wide">
            <h2>Authority has <span class="accent">edges.</span></h2>
            <p>Money, files, public posts, and Web3 broadcasts stay approval-gated. Trust is inspectable.</p>
            <div class="gate-map">
              <div class="gate-item"><strong>Money</strong><span>No hidden financial motion.</span></div>
              <div class="gate-item"><strong>Files</strong><span>Filesystem changes require intent.</span></div>
              <div class="gate-item"><strong>Public posts</strong><span>Publishing remains a human gate.</span></div>
              <div class="gate-item"><strong>Build with us</strong><span>Bring a domain, a boundary, and proof.</span></div>
            </div>
            <div class="callout">
              <strong>The future should feel alive and still be inspectable.</strong>
              <span>Read Transmission 025 on UnwindCode.ai.</span>
            </div>
          </div>
        `
      }
    ];

    const root = document.getElementById("root");
    const slideNumber = Number((location.hash.match(/slide-(\d+)/) || [])[1] || 1);
    const index = Math.max(0, Math.min(slides.length - 1, slideNumber - 1));
    const slide = slides[index];

    root.innerHTML = `
      <section class="slide">
        <header class="top">
          <div class="brand"><span class="brand-mark">UC</span><span>unwind<span>code</span></span></div>
          <div class="kicker">${slide.kicker}</div>
        </header>
        ${slide.body}
        <footer class="bottom">
          <span>${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</span>
          <span class="url">unwindcode.ai</span>
        </footer>
      </section>
    `;
  </script>
</body>
</html>
